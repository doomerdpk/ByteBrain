name: Drift Detection - ByteBrain Infra

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_ssh_public_key: ${{ secrets.BYTEBRAIN_SSH_KEY }}

jobs:
  drift-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -input=false -var-file=bytebrain.tfvars -detailed-exitcode -out=tfplan
        continue-on-error: true

      - name: Fail job if drift detected
        if: steps.plan.outputs.exitcode == '2'
        run: |
          echo "Drift detected — infrastructure differs from Terraform state."
          terraform show -no-color tfplan
          exit 1

      - name: Fail job if plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "Terraform plan failed."
          exit 1

      - name: Open issue on drift
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Terraform drift detected — run #${context.runNumber}`,
              body: `Drift was detected in a scheduled Terraform plan. Check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
              labels: ["terraform-drift"]
            })
