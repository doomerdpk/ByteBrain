name: CI/CD Pipeline to create infra for ByteBrain Application

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "infra/**"

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_ssh_public_key: ${{ secrets.BYTEBRAIN_SSH_KEY }}
  TF_VAR_db_connection_string: ${{ secrets.BYTEBRAIN_DB_CONNECTION_STRING }}
  TF_VAR_jwt_secret: ${{ secrets.BYTEBRAIN_JWT_SECRET }}

jobs:
  PlanAndApply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.2"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -var-file=bytebrain.tfvars -out=tfplan

      - name: Export Plan
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload Plan Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_number }}
          path: |
            infra/tfplan
            infra/tfplan.txt
          retention-days: 30

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
